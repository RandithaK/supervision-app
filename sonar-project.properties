sonar.projectKey=supervision-app
sonar.projectName=Supervision App
sonar.projectVersion=0.1.0

# Source directories
sonar.sources=app,components,lib,scripts
sonar.exclusions=**/node_modules/**,**/.next/**,**/out/**,**/*.ico,**/*.png,**/*.jpg,**/*.jpeg,**/*.svg,**/*.webp

# TypeScript
sonar.typescript.tsconfigPath=tsconfig.json

# Quality Gate enforcement (fails CI build if Quality Gate fails)
sonar.qualitygate.wait=true
