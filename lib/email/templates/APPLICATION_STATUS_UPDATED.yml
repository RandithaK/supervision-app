subject: "Application Status Update: {{status}} ({{programName}})"
title: "Application Status Updated: {{status}}"
badge:
  text: "{{status}}"
  color: "{{badgeColor}}"
content: |
  <p>Hello <strong>{{userName}}</strong>,</p>
  <p>Your supervision application for <strong>{{programName}}</strong> has been updated to <strong>{{status}}</strong>.</p>
  <p><strong>Reviewer Comments:</strong> {{reviewerNotes}}</p>
details:
  - label: "Program"
    value: "{{programName}}"
  - label: "Updated On"
    value: "{{updatedAt}}"
  - label: "Current Status"
    value: "{{status}}"
  - label: "Notes"
    value: "{{reviewerNotes}}"
cta:
  label: "Go to Dashboard"
  url: "{{actionUrl}}"
footerText: "You can view application details or apply to other supervisors in this program directly from your portal."
