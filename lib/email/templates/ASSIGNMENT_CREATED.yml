subject: "Supervision Assignment: {{supervisorName}} & {{superviseeName}}"
title: "New Supervision Match Established"
badge:
  text: "New Assignment"
  color: "accent"
content: |
  <p>Hello <strong>{{recipientName}}</strong>,</p>
  <p>A new supervision match has been officially established between <strong>{{supervisorName}}</strong> (Supervisor) and <strong>{{superviseeName}}</strong> (Supervisee).</p>
  <p>You can now view contact details, schedule sessions, and track progress through your supervision portal.</p>
details:
  - label: "Supervisor"
    value: "{{supervisorName}}"
  - label: "Supervisee"
    value: "{{superviseeName}}"
  - label: "Assignment Date"
    value: "{{assignedDate}}"
  - label: "Notes"
    value: "{{notes}}"
cta:
  label: "Open Supervision Dashboard"
  url: "{{dashboardUrl}}"
