subject: "Your Supervision App Verification Code: {{otp}}"
title: "Verify Your Email Address"
badge:
  text: "Action Required"
  color: "accent"
content: |
  <p>Hello,</p>
  <p>Please use the following 6-digit verification code to complete your registration process on the Supervision App platform.</p>
  <div style="background-color: #f8fafc; border-left: 4px solid var(--border-color, #4f46e5); padding: 16px; margin: 24px 0; border-radius: 4px; text-align: center;">
    <h2 style="margin: 0; font-size: 32px; font-weight: 800; letter-spacing: 0.1em; color: #1e293b;">{{otp}}</h2>
  </div>
  <p style="font-size: 14px; color: #64748b;">This code will expire in 10 minutes. If you did not request this verification code, please ignore this email.</p>
