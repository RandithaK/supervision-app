subject: "Reset Your Password - Supervision App"
title: "Password Reset Request"
badge:
  text: "Security Action Required"
  color: "destructive"
content: |
  <p>Hello <strong>{{userName}}</strong>,</p>
  <p>We received a request to reset your password for your Supervision App account.</p>
  <p>Click the button below to set a new password. This link will expire in <strong>{{expiresIn}}</strong>.</p>
  <p style="font-size: 13px; color: #64748b; margin-top: 16px;">If you did not request a password reset, please ignore this email or contact your administrator immediately.</p>
cta:
  label: "Reset Password"
  url: "{{resetUrl}}"
